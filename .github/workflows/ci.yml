name: test
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: black --check blindspot app.py tests
      - run: isort --check blindspot app.py tests
      - run: ruff check blindspot app.py tests
      - run: mypy blindspot app.py
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
# CI runs synthetic contract tests without downloading third-party data.
# Local integration tests also exercise the trained artifact and Streamlit app.
